name: Update streak stats
on:
  schedule:
    - cron: "0 3 * * *" # Runs daily
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DenverCoder1/github-readme-streak-stats-action@main
        with:
          options: user=abdulalisadaqat&theme=tokyonight&hide_border=true
          path: profile/streak.svg
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git add profile/streak.svg
          git commit -m "Update" || exit 0
          git push
